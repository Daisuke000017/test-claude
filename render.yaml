services:
  # PostgreSQL Database
  - type: pserv
    name: realtime-poll-db
    env: docker
    plan: free
    region: oregon

  # Redis
  - type: redis
    name: realtime-poll-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction

  # Backend API
  - type: web
    name: realtime-poll-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd backend && npm install && npm run prisma:generate && npm run build
    startCommand: cd backend && npm run prisma:migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: realtime-poll-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: realtime-poll-redis
          type: redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://realtime-poll-frontend.onrender.com
      - key: PORT
        value: 3000

  # Frontend
  - type: web
    name: realtime-poll-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://realtime-poll-backend.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://realtime-poll-backend.onrender.com
